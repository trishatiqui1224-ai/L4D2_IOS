name: Build Left 4 Dead 2 iOS IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug

permissions:
  contents: write

jobs:
  build-ios:
    name: Build L4D2 Recomp iOS (ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 16 for C++20/C++23 Toolchain
        run: |
          XCODE_16=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "${XCODE_16}" ]; then
            echo "[CI] Selecting Xcode at ${XCODE_16}..."
            sudo xcode-select -s "${XCODE_16}"
          else
            echo "[CI] Xcode not found by glob, checking active Xcode:"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --find clang++

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow
          HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Cache ReXGlue iOS SDK & MoltenVK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: |
            ${{ github.workspace }}/../rexglue-sdk-ios
            ~/.nfsc-ios
          key: ${{ runner.os }}-rexglue-sdk-v0.10.0-mvk-1.4.1-l4d2-p1
          restore-keys: |
            ${{ runner.os }}-rexglue-sdk-v0.10.0-mvk-1.4.1-

      - name: Setup AppIcon & Assets Catalog
        run: |
          python3 tools/generate_appicon.py

      - name: Verify Disc Manifest & Generate C++ Headers
        run: |
          python3 tools/verify_assets.py --gen-header

      - name: "Pre-Flight Check: Run Unit Tests with ASan & UBSan"
        run: |
          echo "[CI] Compiling and running host argv deduplication test (ASan/UBSan)..."
          clang++ -std=c++20 -fsanitize=address,undefined -Wall -Wextra tools/test_argv_dedup.cpp -o /tmp/test_argv_dedup
          /tmp/test_argv_dedup
          rm -f /tmp/test_argv_dedup

          echo "[CI] Compiling and running disc manifest verifier test (ASan/UBSan)..."
          clang++ -std=c++20 -fsanitize=address,undefined -Wall -Wextra tools/test_manifest_verifier.cpp -o /tmp/test_manifest_verifier
          /tmp/test_manifest_verifier
          rm -f /tmp/test_manifest_verifier
          echo "[CI] All pre-flight unit tests PASSED cleanly with 0 sanitizer violations."

      - name: Restore Recompiled C++ Sources from gen.tar.gz
        run: |
          echo "[CI] Restoring all 22 recompiled Source Engine modules..."
          python3 tools/generate_code.py --unpack-cache
          python3 tools/make_stubs.py
          python3 tools/patch_safe_indirect_dispatch.py --apply
          python3 tools/patch_safe_indirect_dispatch.py --status

      - name: Verify Static Multi-Module Dispatcher Coverage
        run: |
          python3 tools/verify_recomp_dispatch.py

      - name: Prepare ReXGlue iOS SDK & MoltenVK
        run: |
          echo "[CI] Preparing ReXGlue iOS SDK tree and MoltenVK.framework..."
          python3 tools/ios/prepare_sdk.py --sdk "${GITHUB_WORKSPACE}/../rexglue-sdk-ios"
          L4D2_SDK="${GITHUB_WORKSPACE}/../rexglue-sdk-ios" python3 tools/ios/patch_ios_host_stack.py --status
          L4D2_SDK="${GITHUB_WORKSPACE}/../rexglue-sdk-ios" python3 tools/ios/patch_ios_relative_paths.py --status
          L4D2_SDK="${GITHUB_WORKSPACE}/../rexglue-sdk-ios" python3 tools/ios/patch_ios_function_table.py --status
          L4D2_SDK="${GITHUB_WORKSPACE}/../rexglue-sdk-ios" python3 tools/ios/patch_ios_signal_forwarding.py --status
          if [ -d "${GITHUB_WORKSPACE}/../rexglue-sdk-ios" ]; then
            (cd "${GITHUB_WORKSPACE}/../rexglue-sdk-ios" && git tag -f v0.10.0 HEAD 2>/dev/null || true)
          fi

      - name: Configure CMake for iOS (ARM64 Native)
        run: |
          mkdir -p build dist
          cd ios
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CXX="$(xcrun --sdk iphoneos --find clang++)"
          export OBJC="${CC}"
          export OBJCXX="${CXX}"

          cmake -B ../build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DREX_PLATFORM_IOS=1 \
            -DL4D2_SDK="${GITHUB_WORKSPACE}/../rexglue-sdk-ios" \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_OBJC_COMPILER="${CC}" \
            -DCMAKE_OBJCXX_COMPILER="${CXX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Compile iOS Target Bundle & Static Recomp Modules
        run: |
          if cmake --build build --config Release -- -j 4; then
            exit 0
          fi

          echo "[CI] Parallel build failed; retrying with verbose single-job output..."
          set +e
          cmake --build build --config Release -v -- -j 1 2>&1 | tee /tmp/l4d2-ios-build-retry.log
          build_status=${PIPESTATUS[0]}
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo "### Native build diagnostics" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'error:|fatal error:|undefined reference|ld: error:|ninja: build stopped' /tmp/l4d2-ios-build-retry.log | tail -n 60 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"

            while IFS= read -r line; do
              safe_line=${line//'%'/'%25'}
              safe_line=${safe_line//$'\r'/'%0D'}
              safe_line=${safe_line//$'\n'/'%0A'}
              echo "::error::$safe_line"
            done < <(grep -E 'error:|fatal error:|undefined reference|ld: error:|ninja: build stopped' /tmp/l4d2-ios-build-retry.log | tail -n 20 || true)
          fi

          exit "$build_status"

      - name: Package Distributable .ipa
        run: |
          python3 tools/package_ipa.py --out dist/L4D2-Recomp-iOS.ipa

      - name: "Mandatory CI Launch-Readiness Gate: Binary, Frameworks, RPATH & Plist Audit"
        run: |
          python3 tools/verify_ios_bundle.py --ipa dist/L4D2-Recomp-iOS.ipa

      - name: "Mandatory CI Verification Gate: Binary Size & Symbol Verification"
        run: |
          cd dist
          IPA_BYTES=$(stat -f%z L4D2-Recomp-iOS.ipa 2>/dev/null || stat -c%s L4D2-Recomp-iOS.ipa)
          echo "IPA size: $IPA_BYTES bytes"
          if [ "$IPA_BYTES" -lt 45000000 ]; then
            echo "ERROR: IPA is smaller than 45 MB ($IPA_BYTES bytes) — missing recompiled code or frameworks!"
            exit 1
          fi

          echo "[CI] Inspecting IPA Frameworks:"
          unzip -l L4D2-Recomp-iOS.ipa | grep -E "Frameworks/MoltenVK\.framework/MoltenVK|librexruntime\.dylib|librexgpu-xenos\.dylib|L4D2Game\.framework/L4D2Game"

          echo "[CI] Inspecting compiled guest functions & pure launcher linkage:"
          rm -rf /tmp/ipa_inspect
          unzip -q L4D2-Recomp-iOS.ipa -d /tmp/ipa_inspect

          # 1. Verify UNIX -rwxr-xr-x (755) permissions inside the ZIP!
          echo "[CI] Verifying UNIX permissions inside ZIP..."
          zipinfo -l L4D2-Recomp-iOS.ipa | grep "Payload/L4D2Recomp.app/L4D2Recomp$" | grep "^-rwxr-xr-x"
          zipinfo -l L4D2-Recomp-iOS.ipa | grep "Frameworks/L4D2Game.framework/L4D2Game$" | grep "^-rwxr-xr-x"

          # 2. Verify main launcher binary has ZERO @rpath / custom dylib load-time dependencies!
          echo "[CI] Verifying pure minimal UIKit launcher (ZERO custom @rpath load-time dependencies)..."
          otool -L /tmp/ipa_inspect/Payload/L4D2Recomp.app/L4D2Recomp
          if otool -L /tmp/ipa_inspect/Payload/L4D2Recomp.app/L4D2Recomp | grep -E "@rpath|@loader_path|/Users/|/opt/|AppKit|IOKit|libvulkan"; then
            echo "FATAL: Main launcher executable must not link custom/@rpath/macOS libraries at load time!"
            exit 1
          fi

          # 3. Verify L4D2Game framework exists, dependencies exist in Frameworks/, and CFBundleIcons is in Info.plist
          GAME_BIN="/tmp/ipa_inspect/Payload/L4D2Recomp.app/Frameworks/L4D2Game.framework/L4D2Game"
          test -f "$GAME_BIN" || { echo "ERROR: Missing L4D2Game binary in framework!"; exit 1; }

          echo "[CI] Verifying all @rpath dependencies required by L4D2Game exist in bundle..."
          for dep in $(otool -L "$GAME_BIN" | awk '/@rpath\//{print $1}' | sed 's|@rpath/||'); do
            echo "Verifying @rpath dependency exists: Frameworks/$dep"
            test -f "/tmp/ipa_inspect/Payload/L4D2Recomp.app/Frameworks/$dep" || {
              echo "ERROR: Missing @rpath dependency Frameworks/$dep required by L4D2Game!"
              exit 1
            }
          done

          echo "[CI] Verifying CFBundleIcons in Info.plist..."
          grep -q "CFBundleIcons" /tmp/ipa_inspect/Payload/L4D2Recomp.app/Info.plist || {
            echo "ERROR: Missing CFBundleIcons in Info.plist!"
            exit 1
          }

          # 4. Verify _OBJC_CLASS_$_SDLUIKitDelegate exists in EXACTLY 1 binary in the entire bundle (owned by librexruntime.dylib)
          echo "[CI] Auditing _OBJC_CLASS_\$_SDLUIKitDelegate definition across app bundle..."
          DELEGATE_MATCHES=$(find /tmp/ipa_inspect/Payload/L4D2Recomp.app -type f -exec nm -gU {} + 2>/dev/null | grep -F -c '_OBJC_CLASS_$_SDLUIKitDelegate' || true)
          echo "SDLUIKitDelegate symbol definitions found: $DELEGATE_MATCHES"
          if [ "$DELEGATE_MATCHES" -ne 1 ]; then
            echo "FATAL: Expected exactly 1 _OBJC_CLASS_\$_SDLUIKitDelegate in the entire bundle (in librexruntime.dylib), found $DELEGATE_MATCHES!"
            exit 1
          fi
          echo "[CI] Verified: Exactly 1 SDLUIKitDelegate exists in the process (owned by librexruntime.dylib)."

          # 5. Verify compiled guest functions in L4D2Game framework
          FUNC_COUNT=$(nm -gU "$GAME_BIN" | grep -c "sub_8" || true)
          echo "Compiled guest function symbols in L4D2Game: $FUNC_COUNT"
          if [ "$FUNC_COUNT" -lt 10000 ]; then
            echo "ERROR: Expected 10,000+ compiled PPC functions in L4D2Game, found $FUNC_COUNT!"
            exit 1
          fi
          for symbol in xstart sub_836940A0 l4d2_tier0_PPCImageConfig l4d2_vstdlib_PPCImageConfig l4d2_launcher_PPCImageConfig; do
            if ! nm -gU "$GAME_BIN" | grep -Fq "$symbol"; then
              echo "ERROR: Required startup function or module config $symbol is missing from L4D2Game."
              exit 1
            fi
          done
          echo "[CI] Verified tier0/vstdlib/launcher entry functions and module configs are linked into L4D2Game."
          echo "[CI] Verification PASSED: Real static-recompiled IPA verified ($IPA_BYTES bytes, $FUNC_COUNT PPC functions)."
          rm -rf /tmp/ipa_inspect

      - name: Compute Checksums & Verify Artifacts
        run: |
          cd dist
          shasum -a 256 L4D2-Recomp-iOS.ipa > SHA256SUMS.txt
          echo "[CI] SHA-256 Checksums:"
          cat SHA256SUMS.txt

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: L4D2-Recomp-iOS-unsigned-ipa
          path: |
            dist/L4D2-Recomp-iOS.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/L4D2-Recomp-iOS.ipa
            dist/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-test') }}
          generate_release_notes: true
