workflows:
  build-l4d2-recomp-ios:
    name: Build Left 4 Dead 2 unsigned iOS IPA (ARM64)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        HOMEBREW_NO_AUTO_UPDATE: "1"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'master'
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Select Xcode & Verify Toolchain
        script: |
          echo "[CI] Selecting active Xcode..."
          xcodebuild -version
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --find clang++

      - name: Install Tools and Prepare App Assets
        script: |
          set -euo pipefail
          for tool in cmake ninja; do
            if ! command -v "$tool" >/dev/null; then
              brew install "$tool"
            fi
          done
          python3 -m venv .venv
          .venv/bin/python -m pip install pillow
          .venv/bin/python tools/generate_appicon.py

      - name: Verify Disc Manifest & Generate Headers
        script: |
          python3 tools/verify_assets.py --gen-header

      - name: Run Host Unit Tests
        script: |
          set -euo pipefail
          for test in test_argv_dedup test_manifest_verifier; do
            clang++ -std=c++20 -fsanitize=address,undefined "tools/$test.cpp" -o "$TMPDIR/$test"
            "$TMPDIR/$test"
          done

      - name: Restore and Patch Recompiled Sources
        script: |
          set -euo pipefail
          python3 tools/generate_code.py --unpack-cache
          python3 tools/make_stubs.py
          python3 tools/patch_safe_indirect_dispatch.py --apply
          python3 tools/patch_cross_dll_thunks.py --apply
          python3 tools/patch_unique_entry_points.py --apply
          python3 tools/patch_tier0_null_check.py --apply
          python3 tools/patch_engine_null_vtable.py
          python3 tools/patch_engine_cleanup.py
          python3 tools/verify_recomp_dispatch.py

      - name: Prepare ReXGlue SDK and MoltenVK
        script: |
          set -euo pipefail
          python3 tools/ios/prepare_sdk.py --sdk "$CM_BUILD_DIR/../rexglue-sdk-ios"

      - name: Configure and Compile the iOS App
        script: |
          set -euo pipefail
          cc="$(xcrun --sdk iphoneos --find clang)"
          cxx="$(xcrun --sdk iphoneos --find clang++)"
          cmake -S ios -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4 \
            -DREX_PLATFORM_IOS=1 \
            -DL4D2_SDK="$CM_BUILD_DIR/../rexglue-sdk-ios" \
            -DCMAKE_C_COMPILER="$cc" \
            -DCMAKE_CXX_COMPILER="$cxx" \
            -DCMAKE_OBJC_COMPILER="$cc" \
            -DCMAKE_OBJCXX_COMPILER="$cxx" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=
          cmake --build build --parallel 4

      - name: Package and Verify the Unsigned IPA
        script: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/package_ipa.py --out dist/L4D2-Recomp-iOS.ipa
          python3 tools/verify_ios_bundle.py --ipa dist/L4D2-Recomp-iOS.ipa
          cd dist
          shasum -a 256 L4D2-Recomp-iOS.ipa > SHA256SUMS.txt

    artifacts:
      - dist/L4D2-Recomp-iOS.ipa
      - dist/SHA256SUMS.txt

